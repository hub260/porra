<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Porra Mundial 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --verde:   #00843D;
    --verde-c: #00A94F;
    --oro:     #C9A84C;
    --plata:   #9E9E9E;
    --bronce:  #A05A2C;
    --fondo:   #0B1120;
    --card:    #131E2F;
    --borde:   #1E2E45;
    --texto:   #E8EDF3;
    --sub:     #7A8FA6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #062a17 0%, #0B1120 60%);
    border-bottom: 2px solid var(--verde);
    padding: 28px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,168,79,.18) 0%, transparent 70%);
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 7vw, 4rem);
    letter-spacing: .04em;
    line-height: 1;
    position: relative;
    color: #fff;
  }
  header h1 span { color: var(--oro); }
  .meta {
    margin-top: 8px;
    font-size: .78rem;
    color: var(--sub);
    position: relative;
  }
  .meta strong { color: var(--verde-c); }

  /* ── MAIN LAYOUT ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  /* ── PODIO ── */
  .podio {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
  }
  .podio-item {
    flex: 1;
    max-width: 220px;
    text-align: center;
  }
  .podio-item .nombre {
    font-weight: 700;
    font-size: .95rem;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .podio-item .pts-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    line-height: 1;
  }
  .podio-item .pedestal {
    margin-top: 10px;
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: rgba(255,255,255,.15);
  }
  .p1 .pedestal { background: linear-gradient(180deg,#b8942b,#8a6c1e); height: 120px; }
  .p2 .pedestal { background: linear-gradient(180deg,#7a7a7a,#555); height: 90px; }
  .p3 .pedestal { background: linear-gradient(180deg,#7a4820,#5a3218); height: 70px; }
  .p1 .pts-big  { color: var(--oro); }
  .p2 .pts-big  { color: var(--plata); }
  .p3 .pts-big  { color: var(--bronce); }

  /* ── TABLA CLASIFICACIÓN ── */
  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: .08em;
    color: var(--sub);
    border-bottom: 1px solid var(--borde);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .88rem;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    color: var(--sub);
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--borde);
  }
  thead th.r { text-align: right; }

  tbody tr {
    border-bottom: 1px solid var(--borde);
    transition: background .15s;
  }
  tbody tr:hover { background: rgba(255,255,255,.03); }

  td {
    padding: 13px 12px;
    vertical-align: middle;
  }
  td.r { text-align: right; }

  .pos {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--sub);
    width: 32px;
  }
  .pos.top1 { color: var(--oro); }
  .pos.top2 { color: var(--plata); }
  .pos.top3 { color: var(--bronce); }

  .nombre-td { font-weight: 600; }

  .equipos-td {
    font-size: .75rem;
    color: var(--sub);
    line-height: 1.5;
  }
  .eq-tag {
    display: inline-block;
    background: var(--borde);
    border-radius: 4px;
    padding: 1px 5px;
    margin: 1px 2px 1px 0;
    font-size: .7rem;
  }

  .pts-td {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--verde-c);
    white-space: nowrap;
  }

  /* ── ESTADO ── */
  #estado {
    text-align: center;
    margin-bottom: 24px;
    font-size: .8rem;
    color: var(--sub);
  }
  #estado .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--verde-c);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; }
    50% { opacity:.3; }
  }

  /* ── SKELETON ── */
  .skeleton-row td { padding: 16px 12px; }
  .skel {
    background: linear-gradient(90deg, var(--borde) 25%, #1e3050 50%, var(--borde) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 14px;
    display: inline-block;
  }
  @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

  /* ── ERROR ── */
  .error-box {
    background: rgba(180,30,30,.12);
    border: 1px solid rgba(180,30,30,.4);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    color: #e07070;
    font-size: .9rem;
  }
  .error-box code {
    display: block;
    margin-top: 8px;
    font-size: .75rem;
    color: var(--sub);
    word-break: break-all;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    color: var(--sub);
    font-size: .72rem;
    padding: 20px;
    border-top: 1px solid var(--borde);
  }
</style>
</head>
<body>

<header>
  <h1>🏆 Porra <span>Mundial 2026</span></h1>
  <p class="meta">Inscripción: 20€ &nbsp;·&nbsp; 1º=70% &nbsp;·&nbsp; 2º=20% &nbsp;·&nbsp; 3º=10%</p>
</header>

<main>

  <div id="estado">
    <span class="dot"></span>
    <span id="estado-texto">Cargando clasificación…</span>
  </div>

  <!-- PODIO -->
  <div class="podio" id="podio" style="display:none"></div>

  <!-- TABLA -->
  <p class="section-title">Clasificación completa</p>
  <div id="error-container"></div>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Participante</th>
        <th>Equipos elegidos</th>
        <th>Goleadores</th>
        <th class="r">Pts equipos</th>
        <th class="r">Pts goleg.</th>
        <th class="r">Total</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <!-- skeletons -->
      <tr class="skeleton-row"><td><span class="skel" style="width:20px"></span></td><td><span class="skel" style="width:120px"></span></td><td><span class="skel" style="width:180px"></span></td><td><span class="skel" style="width:140px"></span></td><td></td><td></td><td></td></tr>
      <tr class="skeleton-row"><td><span class="skel" style="width:20px"></span></td><td><span class="skel" style="width:90px"></span></td><td><span class="skel" style="width:200px"></span></td><td><span class="skel" style="width:160px"></span></td><td></td><td></td><td></td></tr>
      <tr class="skeleton-row"><td><span class="skel" style="width:20px"></span></td><td><span class="skel" style="width:110px"></span></td><td><span class="skel" style="width:170px"></span></td><td><span class="skel" style="width:130px"></span></td><td></td><td></td><td></td></tr>
    </tbody>
  </table>

</main>

<footer id="footer">Actualizado con datos del Excel — <span id="last-update"></span></footer>

<script>
const MEDAL = ['🥇','🥈','🥉'];

async function cargar() {
  try {
    const res = await fetch('datos.json?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Detectar estructura: si es array de objetos con campo NOMBRE, es la hoja PARTICIPANTES
    // Si no hay PUNTOS TOTALES, mostramos igual lo que haya
    const filas = data
      .filter(f => f['NOMBRE'] || f['Nombre'] || f['nombre'])
      .map(f => {
        const nombre = f['NOMBRE'] || f['Nombre'] || f['nombre'] || '—';
        const equipos = [f['T1'],f['T2'],f['T3'],f['T4'],f['T5']].filter(Boolean);
        const goles   = [f['G1'],f['G2'],f['G3'],f['G4'],f['G5']].filter(Boolean);
        const ptsEq   = Number(f['PTS EQUIPOS'] || f['PTS BASE EQUIPOS'] || 0);
        const ptsGol  = Number(f['PTS GOLEADORES'] || f['PTS BASE GOLEG.']   || 0);
        const total   = Number(f['PTS TOTALES'] || f['PUNTOS TOTALES']       || (ptsEq + ptsGol));
        return { nombre, equipos, goles, ptsEq, ptsGol, total };
      })
      .sort((a,b) => b.total - a.total);

    if (!filas.length) throw new Error('No se encontraron participantes en datos.json');

    // Estado
    document.getElementById('estado-texto').textContent =
      `${filas.length} participantes · actualizado ${new Date().toLocaleTimeString('es-ES', {hour:'2-digit',minute:'2-digit'})}`;

    // Podio
    const podio = document.getElementById('podio');
    const order = filas.length >= 3
      ? [filas[1], filas[0], filas[2]]   // plata centro-izq, oro centro, bronce dcha
      : filas.slice(0,3);
    const clases = filas.length >= 3 ? ['p2','p1','p3'] : ['p1','p2','p3'];
    const heights = filas.length >= 3 ? [90,120,70] : [120,90,70];

    podio.innerHTML = order.map((p,i) => `
      <div class="podio-item ${clases[i]}">
        <div class="nombre">${MEDAL[i === 0 && filas.length >= 3 ? 1 : i === 1 ? 0 : 2]} ${p.nombre}</div>
        <div class="pts-big">${p.total} pts</div>
        <div class="pedestal" style="height:${heights[i]}px">${i===1&&filas.length>=3?'1':i===0?'2':'3'}</div>
      </div>`).join('');
    podio.style.display = 'flex';

    // Tabla
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = filas.map((p,i) => {
      const posClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
      const eqTags = p.equipos.map(e=>`<span class="eq-tag">${e}</span>`).join('');
      const golStr = p.goles.join(', ') || '—';
      return `<tr>
        <td class="pos ${posClass}">${i+1}</td>
        <td class="nombre-td">${p.nombre}</td>
        <td class="equipos-td">${eqTags || '—'}</td>
        <td class="equipos-td">${golStr}</td>
        <td class="pts-td r">${p.ptsEq || '—'}</td>
        <td class="pts-td r">${p.ptsGol || '—'}</td>
        <td class="pts-td r" style="color:#fff">${p.total}</td>
      </tr>`;
    }).join('');

    document.getElementById('last-update').textContent =
      new Date().toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  } catch(e) {
    document.getElementById('tbody').innerHTML = '';
    document.getElementById('estado-texto').textContent = 'Error al cargar los datos';
    document.getElementById('error-container').innerHTML = `
      <div class="error-box">
        ⚠️ No se pudo cargar <strong>datos.json</strong><br>
        Asegúrate de que el archivo existe en el mismo repositorio de GitHub.<br>
        <code>${e.message}</code>
      </div>`;
    document.getElementById('podio').style.display = 'none';
  }
}

cargar();
</script>
</body>
</html>
